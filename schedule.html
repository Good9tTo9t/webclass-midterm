  <main class="page-content">

    <h1>活動賽程</h1>

    <section class="practice-table">
      <h2>每週練習時間</h2>
      <table>
        <thead>
          <tr>
            <th>星期</th>
            <th>時間</th>
            <th>地點</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>每周一</td>
            <td>19:00~21:00</td>
            <td>大禮堂 or 承德廣場</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="countdown">
      <h2>距離下次練習還有</h2>
      <p id="countdown-display">--</p>

        <thead>
          <tr>
            <th>日期</th>
            <th>先攻</th>
            <th>比分</th>

          <tr>
            <td>2026/11/07</td>

            <td>Cap Samurai</td>

          <tr>
            <td>2026/11/07</td>
            <td>臺北科大</td>
            <td>0 : 2</td>
